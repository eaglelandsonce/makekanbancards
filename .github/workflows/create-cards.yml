name: Sync kanban cards
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only (no GitHub writes)
        type: boolean
        default: true
  push:
    branches: [main]
    paths: [tasks.yml]
permissions:
  contents: read
  issues: write
concurrency:
  group: sync-kanban-cards
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_SYNC == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Preview or sync cards
        env:
          ISSUE_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: python scripts/sync_cards.py
